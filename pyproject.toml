[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rozetta"
version = "0.1.1"
description = "MCP server exposing YouTube transcript retrieval and statistics lookup"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "youtube-transcript-api>=1.2.0",
    "httpx>=0.27",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
rozetta = "server:main"

[project.urls]
Homepage = "https://github.com/Yuuzulight/Rozetta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "server",
    "video_info",
    "transcript",
    "stats",
    "channel_resolve",
    "quota",
    "models",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
